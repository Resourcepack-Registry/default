name: 'Reset Tags'

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  reset:
    name: 'Reset'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Generate GitHub App token'
        id: 'app-token'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: 'Configure GIT'
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ secrets.APP_USER_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: 'Checkout repository'
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: 'Remove all tags'
        run: |
          tags=$(git ls-remote --tags --refs origin | awk '{print $2}')
          
          if [ -n "$tags" ]; then
              echo "$tags" | xargs git push origin --delete
          else
              echo "No remote tags to delete."
          fi
